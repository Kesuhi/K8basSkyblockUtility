plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven {
		name = "Hypixel"
		url = "https://repo.hypixel.net/repository/Hypixel/"
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

fabricApi {
	// Client gametests (src/gametest) run with `./gradlew runClientGameTest`. They open a game
	// window, so they are not part of `check`.
	configureTests {
		createSourceSet = true
		modId = "k8bas_skyblock_utility_gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config powers the settings screen; a real (non-optional) dependency.
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mod Menu integration is optional: compiled against, but not required at runtime.
	compileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"

	// Official Hypixel Mod API: how the current island is determined (NPC Search and Mob
	// Highlighter's island gating both need it). Only the loader-agnostic protocol library is a
	// compile/bundle dependency here — the actual Fabric networking glue that talks to the
	// server is a separate mod ("Hypixel Mod API" on Modrinth) players install themselves,
	// declared via fabric.mod.json's depends, per Hypixel's own documented setup. Bundling a
	// private copy via include() isn't the supported pattern for this library.
	implementation "net.hypixel:mod-api:${project.hypixel_modapi_version}"
	// The Fabric glue players install themselves; only on the dev runtime (runClient, gametests).
	localRuntime "maven.modrinth:hypixel-mod-api:${project.hypixel_modapi_fabric_version}"

	// Unit tests for pure logic (rule matching, config loading, data parsing); not shipped.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
